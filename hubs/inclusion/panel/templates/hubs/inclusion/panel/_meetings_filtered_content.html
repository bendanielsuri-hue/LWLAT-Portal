{% load static %}
<div class="meeting-list" data-selectable="single">
    {% include 'hubs/inclusion/panel/_meetings_rows.html' %}
</div>

<div class="stats-strip">
    <div class="stat-card">
        <div class="stat-value">{{ meetings_count }}</div>
        <div class="stat-label">Meetings</div>
    </div>
    <div class="stat-card">
        <div class="stat-value">{{ upcoming_meetings_count }}</div>
        <div class="stat-label">Upcoming</div>
    </div>
    <div class="stat-card">
        <div class="stat-value">{{ past_meetings_count }}</div>
        <div class="stat-label">Past</div>
    </div>
</div>
