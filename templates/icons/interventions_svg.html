<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <!--
    The outer ring is an arc rather than a circle: it runs 310 degrees and
    stops either side of the arrow's shaft instead of being crossed by it.
    A full circle here puts the shaft through the ring at a shallow angle,
    and at 16-20px the two strokes merge into a knot at the crossing point.
    The gap spans roughly -20 to -70 degrees, which is where the shaft
    passes, so widening the gap or moving the arrow means recomputing both
    arc endpoints together.
  -->

  <circle cx="10.6" cy="13.4" r="3.2" stroke="currentColor" stroke-width="1.5" fill="none" />
  <path d="M10.6 13.4L20.4 3.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none" />

</svg>
