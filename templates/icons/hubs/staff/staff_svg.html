<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
  <!--
    A staff pass rather than a person. The plain head-and-shoulders figure
    this replaced was the same drawing as the Student hub icon minus two leg
    strokes, so the two hubs read as one repeated icon in the rail; a pass
    also covers support, admin and site staff, which a teaching-flavoured
    symbol would not.

    There is deliberately no lanyard cord. Two straight lines rising
    symmetrically from the top corners of a rounded box is the aerial-and-
    television pictogram, and that is what every corded version read as -
    standing the card up portrait did not fix it, because the V was doing the
    work, not the proportions. Without the cord the wide card is safe.

    The near neighbours to keep clear of are now Payslips (a rect with a
    centred circle, in this hub's own menu) and Staff Directory (a book with
    a person on it): the person sits hard left and the detail lines right, so
    the composition reads as off-centre where those two read as centred.
  -->
  <rect x="2.6" y="5" width="18.8" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" />
  <circle cx="8.2" cy="10.8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.4" />
  <path d="M4.9 16c.6-2 1.8-3 3.3-3s2.7 1 3.3 3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
  <path d="M13.6 10h4.8M13.6 13.4h4.8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" />
</svg>
