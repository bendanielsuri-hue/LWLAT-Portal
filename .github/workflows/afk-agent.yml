name: AFK agent (ready-for-agent)

# Fires when the `ready-for-agent` label is applied to an issue — see
# docs/agents/triage-labels.md and docs/agents/issue-tracker.md for the
# label taxonomy this ties into. The agent works the ticket unattended and
# opens a PR for review; it never merges on its own.
#
# `ready-for-agent` means "fully specified", not "safe to run unattended on
# a small model". Two blocker labels carve out the tickets that are the
# former but not the latter, and this workflow skips when either is
# present: `needs-stronger-model` (beyond what the model configured below
# can do well) and `needs-budget-approval` (large enough that an unattended
# run would burn a meaningful chunk of the credit budget). Both are opt-out
# rather than opt-in on purpose — a ticket nobody has judged still runs, and
# the wrong outcome there is a wasted run, not a silently stalled queue.
#
# `issues`-triggered workflows only run from the file on the repo's default
# branch (currently `main`). If a separate published/live branch is ever
# cut, don't just leave `main` as the dev branch and assume this is safe —
# add branch protection (required review, no direct pushes) on the live
# branch regardless, since nothing in this workflow itself restricts where
# a PR could target. This workflow only ever opens PRs, never merges, but
# protection on the live branch is the actual backstop, not this comment.
on:
  issues:
    types: [labeled]

jobs:
  claude:
    if: >-
      github.event.label.name == 'ready-for-agent'
      && !contains(github.event.issue.labels.*.name, 'needs-stronger-model')
      && !contains(github.event.issue.labels.*.name, 'needs-budget-approval')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6

      # Off-hours gate: only run weekday evenings/nights (after 19:00 or
      # before 07:00 UK time) or any time on a weekend. Outside that window,
      # skip and leave a comment — the label stays, so removing and
      # reapplying it during an allowed window retriggers this workflow.
      # (A schedule/cron-based queue was considered instead, so labeling any
      # time would auto-run at the next window, but claude-code-action has a
      # known open bug where cron-triggered runs fail OIDC token exchange —
      # see anthropics/claude-code-action#814 — so this simpler skip-and-
      # relabel approach was chosen instead. Revisit once that's fixed.)
      - name: Check off-hours window
        id: time_check
        run: |
          dow=$(TZ='Europe/London' date +%u)   # 1=Mon .. 7=Sun
          hour=$(TZ='Europe/London' date +%H)  # 00-23
          if [ "$dow" -ge 6 ] || [ "$hour" -ge 19 ] || [ "$hour" -lt 7 ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment if outside window
        if: steps.time_check.outputs.allowed == 'false'
        run: |
          gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body \
            "Labeled during work hours (weekday 07:00-19:00 UK time), so the AFK agent is skipping this for now. Remove and reapply the \`ready-for-agent\` label during an evening/night or weekend to trigger it."
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: anthropics/claude-code-action@v1
        id: claude
        continue-on-error: true
        if: steps.time_check.outputs.allowed == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--model sonnet --max-turns 30"
          prompt: |
            Work the GitHub issue that triggered this run (see the issue
            context provided alongside this prompt). Follow this repo's
            CLAUDE.md and the relevant hub/app CLAUDE.md and CONTEXT.md
            files before making changes.

            Implement what the issue describes, run any relevant checks,
            and open a pull request against main with a clear description
            linking back to the issue. Do not merge the PR yourself.

            If the issue turns out to be underspecified or you hit a
            decision only a human should make, stop, comment on the issue
            explaining what's blocking you and what you need, and remove
            the ready-for-agent label rather than guessing.

      # Label the outcome, so the issue list distinguishes a ticket an
      # agent has already been at from one nothing has touched. Without this a worked ticket looked
      # identical to an untouched one, and reapplying the label would set a
      # second agent off duplicating a PR that already exists.
      #
      # Two outcomes, and the label is the only durable record of which:
      # `ready-for-review` (finished, PR open) and `agent-failed` (errored,
      # or the agent gave up).
      #
      # The two failures are told apart by the label rather than by exit
      # status alone: the prompt tells a stuck agent to remove
      # `ready-for-agent` itself before commenting, and that path exits zero
      # like a success does. So a zero exit with the label still on is the
      # only reliable signature of a completed run. A hard failure also gets
      # a comment here, since unlike the agent's own bail it leaves no
      # explanation on the issue at all — only a run log.
      #
      # `continue-on-error` on the agent step keeps this step reachable on a
      # failure; the run is marked failed at the end so the Actions list
      # still shows red.
      #
      # Adding a label re-fires this `labeled` workflow. The job's `if`
      # filters it out immediately (the added label isn't `ready-for-agent`),
      # so the cost is one skipped run in the Actions list, not a loop.
      - name: Label the outcome
        if: steps.time_check.outputs.allowed == 'true'
        run: |
          issue="${{ github.event.issue.number }}"
          repo="${{ github.repository }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "${{ steps.claude.outcome }}" = "failure" ]; then
            gh issue edit "$issue" --repo "$repo" --remove-label ready-for-agent --add-label agent-failed || true
            gh issue comment "$issue" --repo "$repo" --body "The AFK agent run errored before opening a PR. Log: $run_url"
            exit 1
          fi

          if gh issue view "$issue" --repo "$repo" --json labels --jq '.labels[].name' | grep -qx 'ready-for-agent'; then
            gh issue edit "$issue" --repo "$repo" --remove-label ready-for-agent --add-label ready-for-review
          else
            # The agent removed the label itself: it stopped and explained
            # why in its own comment, so don't add another one here.
            gh issue edit "$issue" --repo "$repo" --add-label agent-failed
          fi
        env:
          GH_TOKEN: ${{ github.token }}
