name: AFK agent (ready-for-agent)

# Fires when a ticket is cleared to be worked unattended — see
# docs/agents/triage-labels.md for the label vocabulary and
# docs/adr/0030-afk-runs-are-permitted-per-run.md for why it is shaped this
# way. The agent opens a PR for review; it never merges on its own.
#
# `issues`-triggered workflows only run from the file on the repo's default
# branch (currently `main`). If a separate published/live branch is ever
# cut, don't just leave `main` as the dev branch and assume this is safe —
# add branch protection (required review, no direct pushes) on the live
# branch regardless, since nothing in this workflow itself restricts where
# a PR could target. This workflow only ever opens PRs, never merges, but
# protection on the live branch is the actual backstop, not this comment.
#
# Two ways in, and they are not redundant. Labelling a ticket starts a run
# immediately, which is what you want when you have just triaged something
# and it is already evening. `workflow_dispatch` is how `afk-queue.yml`
# starts one without a human present, and it exists because a label applied
# by a workflow using the default GITHUB_TOKEN does NOT start another
# workflow — GitHub suppresses that to prevent recursive runs. The
# suppression has documented exceptions, and `workflow_dispatch` is one of
# them ("workflow_dispatch and repository_dispatch events always create
# workflow runs"), which is the whole reason the queue can drive this at all
# without a personal access token.
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to work'
        required: true
        type: string

# One run at a time, queued rather than cancelled. Two reasons, and the
# second is the load-bearing one: runs draw on a Claude subscription's
# rolling usage window rather than per-token billing, so several finishing
# together can empty the window someone was about to work in. And tickets
# in a dependency chain touch the same models and templates — run them in
# parallel and you get PRs that conflict with each other.
concurrency:
  group: afk-agent
  cancel-in-progress: false

jobs:
  claude:
    # Three conditions, in the order they are easiest to read:
    #
    #   1. the label just applied is one of the two that can start a run;
    #   2. the ticket is actually ready for an agent;
    #   3. either nothing blocks it, or you have granted permission.
    #
    # `afk-approved` is in (1) as well as (3) so that granting permission is
    # itself the gesture that starts the run. Without that you would approve
    # a ticket and then have to remember a second step, and the failure mode
    # — an approved ticket that silently never runs — is invisible.
    #
    # A dispatch skips all three, because there is no label event to read
    # them from. That is not a hole: `afk-queue.yml` applies the same
    # predicate when choosing what to dispatch, and the "Resolve the target
    # issue" step below re-checks it against the issue's live labels before
    # anything is spent. Two cheap checks beat one clever one.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (
        (github.event.label.name == 'ready-for-agent'
          || github.event.label.name == 'afk-approved')
        && contains(github.event.issue.labels.*.name, 'ready-for-agent')
        && (
          contains(github.event.issue.labels.*.name, 'afk-approved')
          || (
            !contains(github.event.issue.labels.*.name, 'needs-stronger-model')
            && !contains(github.event.issue.labels.*.name, 'needs-budget-approval')
          )
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # `write`, not `read`: the last step of this job dispatches
      # afk-queue.yml to ask for the next ticket, and dispatching a workflow
      # is a write on the actions scope. With `read` the chain still looked
      # healthy from the outside — the agent ran and the outcome was
      # recorded — and only the hand-off failed, with a 403 that stalls the
      # queue after a single ticket.
      actions: write
    steps:
      - uses: actions/checkout@v6

      # Everything downstream refers to one issue number and one set of
      # labels, and where they came from stops mattering here. A label event
      # carries both in its payload; a dispatch carries neither, only a
      # number typed into an input or passed by the queue.
      #
      # Labels are re-read from the API rather than taken from the event
      # payload even when the payload has them. The payload is a snapshot
      # from when the label was applied, and a run can sit queued behind
      # another for an hour — long enough for someone to have withdrawn
      # `afk-approved` or added `needs-budget-approval` in the meantime.
      # Reading them now means the run spends on what the ticket says at the
      # moment it actually starts.
      - name: Resolve the target issue
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            issue="${{ inputs.issue }}"
          else
            issue="${{ github.event.issue.number }}"
          fi
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

          labels=$(gh issue view "$issue" --repo "${{ github.repository }}" \
                     --json labels --jq '[.labels[].name] | join(" ")')
          echo "Issue #$issue labels: $labels"

          has() { printf '%s' " $labels " | grep -q " $1 "; }

          approved=false; strong=false; wide=false
          has afk-approved         && approved=true
          has needs-stronger-model && strong=true
          has needs-budget-approval && wide=true
          echo "strong=$strong" >> "$GITHUB_OUTPUT"
          echo "wide=$wide" >> "$GITHUB_OUTPUT"

          # Same predicate as the job's `if`, re-applied against live labels.
          eligible=false
          if has ready-for-agent; then
            if [ "$approved" = "true" ] || { [ "$strong" = "false" ] && [ "$wide" = "false" ]; }; then
              eligible=true
            fi
          fi
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"
          [ "$eligible" = "true" ] || echo "::notice::Issue #$issue is no longer eligible; skipping without spending a run."
        env:
          GH_TOKEN: ${{ github.token }}

      # Off-hours gate: only run weekday evenings/nights (after 19:00 or
      # before 07:00 UK time) or any time on a weekend. Outside that window,
      # skip and leave a comment — the label stays, so removing and
      # reapplying it during an allowed window retriggers this workflow.
      # (`afk-queue.yml` now also watches the window and dispatches on its
      # own, so a ticket labelled during the day is picked up at the next
      # window without anyone relabelling it. This gate stays because it is
      # the one place that decides *when*, and two places deciding that is
      # how they drift. The earlier note here said a cron queue was rejected
      # over claude-code-action's OIDC-in-cron bug, anthropics/claude-code-action#814;
      # that bug is still open, and the queue sidesteps it by never running
      # claude-code-action under a `schedule:` trigger — it only dispatches
      # this workflow, which starts on `workflow_dispatch` as it always did.)
      #
      # This applies to approved runs too. Approval answers whether a run
      # should happen; the window answers when. An approved run is by
      # construction the expensive kind, which is more reason to keep it out
      # of working hours, not less.
      - name: Check off-hours window
        id: time_check
        run: |
          dow=$(TZ='Europe/London' date +%u)   # 1=Mon .. 7=Sun
          hour=$(TZ='Europe/London' date +%H)  # 00-23
          if [ "$dow" -ge 6 ] || [ "$hour" -ge 19 ] || [ "$hour" -lt 7 ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          fi

      # Only worth saying out loud on a label event, where a human just did
      # something and is owed an answer. A dispatch outside the window is
      # `afk-queue.yml` being early, which is between the two workflows and
      # does not belong in the ticket's history.
      - name: Comment if outside window
        if: steps.time_check.outputs.allowed == 'false' && github.event_name == 'issues'
        run: |
          gh issue comment "${{ steps.target.outputs.issue }}" --repo "${{ github.repository }}" --body \
            "Labeled during work hours (weekday 07:00-19:00 UK time), so the AFK agent is skipping this for now. The label stays on, and \`afk-queue.yml\` picks it up automatically when the window opens this evening — you don't need to do anything. To force it sooner, remove and reapply the label during an evening/night or weekend."
        env:
          GH_TOKEN: ${{ github.token }}

      # The blocker labels do double duty: they stop an unattended run, and
      # once you have approved one they say what kind of run it should be. A
      # ticket marked `needs-stronger-model` is one you judged beyond the
      # default model, so running it on the default model after approving it
      # would be the wrong half of the decision.
      #
      # All six values come from repo variables (Settings > Secrets and
      # variables > Actions > Variables) so they change without a commit —
      # and without the `workflow` token scope that editing this file needs.
      # The literals are the fallback when a variable is unset.
      #
      # Effort rides with the model rather than getting a label of its own.
      # `needs-stronger-model` already means "this needs sustained judgement
      # rather than sustained typing", which is the same question effort
      # answers; a third label asking it again would be a second dial for
      # one decision. The defaults are the middle of each band in
      # docs/agents/claude-code-usage.md's table rather than the top —
      # these tickets are pre-vetted as fully specified, and effort is the
      # cheaper dial to raise later if runs are coming up short.
      - name: Pick run settings
        id: settings
        if: steps.time_check.outputs.allowed == 'true' && steps.target.outputs.eligible == 'true'
        run: |
          if [ "${{ steps.target.outputs.strong }}" = "true" ]; then
            echo "model=${{ vars.AFK_STRONG_MODEL || 'opus' }}" >> "$GITHUB_OUTPUT"
            echo "effort=${{ vars.AFK_STRONG_EFFORT || 'high' }}" >> "$GITHUB_OUTPUT"
          else
            echo "model=${{ vars.AFK_MODEL || 'sonnet' }}" >> "$GITHUB_OUTPUT"
            echo "effort=${{ vars.AFK_EFFORT || 'medium' }}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ steps.target.outputs.wide }}" = "true" ]; then
            echo "turns=${{ vars.AFK_MAX_TURNS_LARGE || '150' }}" >> "$GITHUB_OUTPUT"
          else
            echo "turns=${{ vars.AFK_MAX_TURNS || '80' }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: anthropics/claude-code-action@v1
        id: claude
        continue-on-error: true
        if: steps.time_check.outputs.allowed == 'true' && steps.target.outputs.eligible == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Runs that afk-queue.yml starts are dispatched by the queue's
          # GITHUB_TOKEN, so the actor GitHub reports is the `github-actions`
          # bot rather than a person. The action refuses a non-human actor by
          # default and exits in under two seconds with "Workflow initiated by
          # non-human actor", which is exactly every unattended run — the only
          # ones that ever worked were those a human started by applying a
          # label, which is the opposite of the point. Naming the one bot that
          # legitimately drives this, rather than opening it to all bots, keeps
          # the allowance as narrow as the actual need. The real permission
          # gate is the label predicate and the off-hours window above, not the
          # identity of the dispatcher.
          allowed_bots: "github-actions[bot]"
          # `--allowedTools` is not optional. The action allows Read, Write,
          # Edit and the GitHub MCP tools by default and denies everything
          # else — Bash entirely. A denial does not fail the run: the agent
          # is simply refused, carries on, and the step still exits zero. The
          # first three runs of this workflow looked green, spent 15 turns
          # each and produced nothing at all for exactly this reason.
          #
          # The list is enumerated rather than opened up to plain `Bash`
          # because a run reaching for something outside it should stop and
          # show up as a failure. `python:*` is here because this repo's
          # tickets routinely require a committed migration, and
          # `makemigrations` is neither git nor gh.
          claude_args: "--model ${{ steps.settings.outputs.model }} --effort ${{ steps.settings.outputs.effort }} --max-turns ${{ steps.settings.outputs.turns }} --allowedTools Read,Write,Edit,Glob,Grep,Bash(git:*),Bash(gh:*),Bash(python:*)"
          prompt: |
            Work GitHub issue #${{ steps.target.outputs.issue }} in this
            repository. Follow this repo's CLAUDE.md and the relevant
            hub/app CLAUDE.md and CONTEXT.md files before making changes.

            Implement what the issue describes and run any relevant checks.
            If you change models, generate the migration and commit it.

            This action does not open a pull request for you. Do it
            yourself, as the last thing you do: create a branch named
            claude/issue-${{ steps.target.outputs.issue }}, commit your work,
            push it, then run `gh pr create --base main` with a body
            containing "Closes #${{ steps.target.outputs.issue }}".

            Do not merge the PR yourself.

            If the issue turns out to be underspecified or you hit a
            decision only a human should make, stop, comment on the issue
            explaining what's blocking you and what you need, and remove
            the ready-for-agent label rather than guessing. Push whatever
            partial work you have onto the branch first — a branch with
            real work on it is worth more than a clean slate.

      # Record the outcome on the issue, because a finished run that leaves
      # no trace is indistinguishable from one that never happened — and
      # reapplying the label would then set a second agent off duplicating a
      # PR that already exists.
      #
      # The test is whether a PR referencing this issue exists. Nothing else
      # is trustworthy: the step's exit status is zero when the agent was
      # denied every tool it needed, zero when it gave up and asked for
      # help, and zero on success. A PR is the only artifact that means the
      # work actually happened.
      #
      # Both `ready-for-agent` and `afk-approved` come off either way. The
      # grant is single-use by design: a retry is a fresh decision to spend,
      # and re-granting it is the moment you look at what went wrong.
      #
      # Adding a label re-fires this `labeled` workflow. The job's `if`
      # filters it out immediately (neither outcome label can start a run),
      # so the cost is one skipped run in the Actions list, not a loop.
      - name: Record the outcome
        if: steps.time_check.outputs.allowed == 'true' && steps.target.outputs.eligible == 'true'
        run: |
          issue="${{ steps.target.outputs.issue }}"
          repo="${{ github.repository }}"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          branch="${{ steps.claude.outputs.branch_name }}"
          exec_file="${{ steps.claude.outputs.execution_file }}"

          # Match the branch this run was told to create, not a mention of
          # the issue number in a body. Searching bodies matched any PR that
          # merely referenced the ticket — a base-class PR saying "unblocks
          # #232, #233, #234" marked all three ready-for-review, stripped
          # their labels and dropped them out of the queue, having produced
          # nothing. Six tickets went that way in one evening. The branch
          # name is dictated by the prompt above, so it identifies this run's
          # own work and cannot collide with a PR about something else.
          #
          # The closing-keyword body match stays as a fallback for a run that
          # opened its PR from a differently named branch, but it is anchored
          # to "closes/fixes/resolves #N" rather than any mention.
          pr=$(gh pr list --repo "$repo" --state all --limit 50 \
                 --json url,body,headRefName \
                 --jq "[.[] | select(.headRefName == \"claude/issue-${issue}\" or (.body | test(\"(clos|fix|resolv)(e|es|ed)? +#${issue}([^0-9]|\$)\"; \"i\")))] | .[0].url // empty")

          # Turns used is not a step output; it is in the execution file the
          # action writes. Worth reporting because --max-turns is the dial
          # you would reach for, and "stopped at the cap" and "stopped
          # because it was finished" look identical from outside.
          turns=""
          if [ -n "$exec_file" ] && [ -f "$exec_file" ]; then
            n=$(jq -r '.. | .num_turns? // empty' "$exec_file" | head -1)
            [ -n "$n" ] && turns=" Used $n of ${{ steps.settings.outputs.turns }} turns."
          fi

          gh issue edit "$issue" --repo "$repo" \
            --remove-label ready-for-agent --remove-label afk-approved || true

          if [ -n "$pr" ]; then
            gh issue edit "$issue" --repo "$repo" --add-label ready-for-review
            exit 0
          fi

          gh issue edit "$issue" --repo "$repo" --add-label agent-failed
          msg="The AFK agent run finished without opening a PR."
          if [ -n "$branch" ] && git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            msg="$msg Partial work was pushed to \`$branch\` — open a PR from it or delete it."
          fi
          gh issue comment "$issue" --repo "$repo" \
            --body "$msg$turns Ran on \`${{ steps.settings.outputs.model }}\`. Log: $run_url"
          exit 1
        env:
          GH_TOKEN: ${{ github.token }}

      # Ask the queue for the next ticket. `always()` because the step above
      # deliberately exits non-zero when a run produced no PR, and a failed
      # ticket must not stop the queue — the next one is unrelated work.
      #
      # This is how the queue advances at all. `workflow_run` on this
      # workflow completing was the obvious mechanism and does not fire:
      # this run was started by the queue's GITHUB_TOKEN, and GitHub's
      # recursion suppression stops a token-triggered run from raising
      # further events. `workflow_dispatch` is a documented exception to
      # that suppression, so asking is reliable where being watched was not.
      #
      # Only when this run actually did work. A run that skipped on the
      # window or on an ineligible ticket must not ask for another, or the
      # pair spin against each other: queue dispatches, agent skips, agent
      # asks, queue dispatches.
      #
      # Passing this run's own id matters — it is still in progress while
      # this step executes, and the queue's "is an agent already busy?"
      # check would otherwise see it and stall on this ticket forever.
      - name: Ask the queue for the next ticket
        if: always() && steps.time_check.outputs.allowed == 'true' && steps.target.outputs.eligible == 'true'
        run: |
          gh workflow run afk-queue.yml --repo "${{ github.repository }}" \
            -f after_run="${{ github.run_id }}"
          echo "::notice::Asked the queue for the next ticket."
        env:
          GH_TOKEN: ${{ github.token }}
