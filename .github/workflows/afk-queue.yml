name: AFK queue

# Drives the AFK agent queue from GitHub, so no Claude Code session has to
# be open for tickets to be worked overnight. See issue #277 for why this
# exists: the queue used to be a local scheduled task on one laptop, which
# meant a closed laptop was a missed night, and that actually happened.
#
# This workflow decides *which* ticket runs next. It never decides whether
# the window is open — `afk-agent.yml` owns that, and two workflows both
# believing they own it is how they drift apart.
#
# It runs no claude-code-action step. That matters: the note in
# afk-agent.yml about cron-triggered runs failing OIDC token exchange
# (anthropics/claude-code-action#814, still open) is about the agent action
# under a `schedule:` trigger. Nothing here invokes it — this only
# dispatches afk-agent.yml, which then starts on `workflow_dispatch` and is
# not a scheduled run at all.
on:
  # Two jobs. It opens the queue when the window opens at 22:00 UK time, and
  # it is the safety net if the hand-off ever fails to fire — a tick every
  # quarter hour means a broken hand-off costs fifteen minutes of idle
  # rather than the whole night.
  #
  # Repeated ticks rather than one pinned start, deliberately. GitHub delays
  # and drops scheduled runs under load, which a frequent schedule shrugs
  # off and a once-a-day one does not.
  #
  # Hours are deliberately wider than the window and in UTC, because cron
  # has no notion of British Summer Time: 22:00 in London is 21:00 UTC in
  # summer and 22:00 UTC in winter, so a pinned hour silently slips by one
  # in late October. 20-23 and 0-6 covers the window under both, with an
  # hour's margin either side. The job re-checks the real window in
  # Europe/London and exits in seconds outside it, so the extra ticks cost
  # almost nothing.
  #
  # One line for every day, since the window no longer varies by day. The
  # weekend used to have its own all-hours cron; it does not need one now.
  schedule:
    - cron: '7,22,37,52 20-23,0-6 * * *'

  # The queue advances one ticket at a time, and afk-agent.yml's last step
  # dispatches this workflow when it has finished real work. That indirection
  # is not a style choice: `workflow_run` was tried here first and does not
  # fire, because the agent run is itself started by this workflow's
  # GITHUB_TOKEN, and GitHub's recursion suppression stops a token-triggered
  # run from raising further events. `workflow_dispatch` is one of the two
  # documented exceptions, so the agent asking for the next ticket works
  # where watching for it to finish silently did not.
  #
  # Sequencing one at a time is a correctness requirement, not tidiness:
  # afk-agent.yml's concurrency group allows only one *pending* run, so
  # dispatching several at once leaves the last one queued and cancels the
  # ones waiting behind it.
  workflow_dispatch:
    inputs:
      after_run:
        # The agent run that asked for the next ticket is still in progress
        # when it asks — dispatching the queue is its own last step. Without
        # naming it here, the busy check below would see it, conclude an
        # agent is already working, and stall the queue permanently on
        # ticket one.
        description: 'Run id to ignore when checking whether an agent is busy'
        required: false
        type: string
      after_issue:
        # The ticket the asking run just handled, excluded from this
        # selection. It is what lets a run that found nothing to do still
        # advance the queue: without it, a run whose ticket turned
        # ineligible mid-flight would hand off, the queue would hand the
        # same ticket straight back, and the two would spin. Excluding one
        # ticket for one tick closes that without the alternative, which was
        # for such a run to stay silent and let the whole night stop.
        description: 'Issue number to skip in this selection'
        required: false
        type: string

# Two schedulers racing would hand out the same ticket twice. Queued rather
# than cancelled so a tick that arrives while another is deciding still gets
# its turn, rather than being dropped.
concurrency:
  group: afk-queue
  cancel-in-progress: false

jobs:
  dispatch-next:
    runs-on: ubuntu-latest
    permissions:
      issues: read
      actions: write
    steps:
      - name: Dispatch the next eligible ticket
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"

          # afk-agent.yml owns the authoritative window check — it is what
          # actually refuses to spend. This is a second, cheaper copy of the
          # same question, and it exists to stop a spin: without it, the
          # queue would dispatch during work hours, the agent would skip,
          # and the hourly tick would do it again every hour all day. Keep
          # the two in step; if one moves, move both.
          hour=$(TZ='Europe/London' date +%H)  # 00-23
          if ! { [ "$hour" -ge 22 ] || [ "$hour" -lt 6 ]; }; then
            echo "::notice::Outside the off-hours window. Nothing dispatched."
            exit 0
          fi

          # Never run two agents at once. afk-agent.yml's concurrency group
          # would queue the second, and a queued run is exactly what gets
          # cancelled when a third arrives — so the guard belongs here,
          # before dispatching, not there.
          #
          # `workflow_run` fires on completion, but the run that just
          # finished can still be reported as in_progress for a moment, so
          # its own id is excluded rather than waiting and hoping.
          after_run="${{ inputs.after_run }}"
          busy=$(gh run list --repo "$repo" --workflow afk-agent.yml --limit 20 \
                   --json databaseId,status \
                 | jq --argjson skip "${after_run:-0}" '
                     [ .[]
                       | select(.status == "in_progress" or .status == "queued" or .status == "waiting")
                       | select(.databaseId != $skip)
                     ] | length')
          if [ "$busy" -gt 0 ]; then
            echo "::notice::An AFK agent run is already active. Leaving the queue alone."
            exit 0
          fi

          # The same predicate afk-agent.yml's job `if` applies: ready for an
          # agent, and either unblocked or explicitly approved. Sorted
          # ascending so the backlog drains oldest-first and the order is
          # predictable from the outside — you can tell which ticket is next
          # without reading this file.
          skip="${{ inputs.after_issue }}"
          next=$(gh issue list --repo "$repo" --label ready-for-agent --state open --limit 100 \
                   --json number,labels \
                 | jq -r --argjson skip "${skip:-0}" '[ .[]
                           | select(.number != $skip)
                           | select(
                               ([.labels[].name] | index("afk-approved"))
                               or (([.labels[].name] | index("needs-stronger-model")) | not)
                                  and (([.labels[].name] | index("needs-budget-approval")) | not)
                             )
                         ] | sort_by(.number) | .[0].number // empty')

          if [ -z "$next" ]; then
            echo "::notice::Nothing eligible in the queue. Done."
            exit 0
          fi

          # Say so when this tick is a rescue rather than a hand-off.
          #
          # Reaching here means there is eligible work and no agent running.
          # If the last agent run also finished a long time ago, the chain
          # broke and this tick is repairing it. The repair is silent by
          # nature — the queue simply starts the next ticket and the night
          # looks normal afterwards — so a chain that breaks every evening
          # and is quietly rescued every evening would never be noticed. A
          # warning annotation costs nothing and shows on the run.
          #
          # It cannot catch every stall: a break that also stops the queue
          # ticking produces no run to carry the warning. That case needs an
          # observer outside the system, which is scripts/afk_status.py.
          last_end=$(gh run list --repo "$repo" --workflow afk-agent.yml --limit 20 \
                       --json status,updatedAt \
                     | jq -r '[ .[] | select(.status == "completed") ]
                              | sort_by(.updatedAt) | last | .updatedAt // empty')
          if [ -n "$last_end" ]; then
            idle=$(( ( $(date -u +%s) - $(date -u -d "$last_end" +%s) ) / 60 ))
            if [ "$idle" -gt 30 ]; then
              echo "::warning::Queue had stalled — no agent run finished for ${idle} minutes while #$next was eligible. The hand-off chain broke and this tick is restarting it."
            fi
          fi

          # A dispatch that silently starts nothing is the failure this whole
          # design is most exposed to, so say plainly what was asked for and
          # fail loudly if the API refuses it. A green run that dispatched
          # nothing must never look like a green run that found nothing.
          echo "Dispatching AFK agent for issue #$next"
          gh workflow run afk-agent.yml --repo "$repo" -f issue="$next"
          echo "::notice::Dispatched AFK agent for issue #$next"
        env:
          GH_TOKEN: ${{ github.token }}
